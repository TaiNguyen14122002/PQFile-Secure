name: pqfile-secure
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pqfile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pqfile
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqfile -d pqfile"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  storage-init:
    image: alpine:3.21
    user: root
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - object_data:/data
    networks: [internal]
  storage:
    # Maintained official S3-compatible server; upstream MinIO Docker Hub images
    # are no longer reliably available as of late 2026.
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    volumes:
      - object_data:/data
    depends_on:
      storage-init: {condition: service_completed_successfully}
    networks: [internal]
    # Object Storage API/Console are deliberately internal only.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pqfile
      DB_USER: pqfile
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: pqfile-ciphertext
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
      SECURITY_HMAC_KEY: ${SECURITY_HMAC_KEY:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
      redis: {condition: service_started}
    # The API is considered healthy only after its DB schema is ready.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks: [internal]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
  gateway:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped
    networks: [internal]
volumes:
  postgres_data:
  object_data:
  redis_data:
networks:
  internal:
    driver: bridge
