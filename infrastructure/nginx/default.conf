server {
    listen 80;
    server_name _;
    client_max_body_size 24m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # /api without the trailing slash must not fall through to the Nuxt SPA.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 '{"statusCode":404,"message":"Use an API endpoint under /api/."}';
    }
    location ^~ /api/ {
        # Preserve the entire /api/... URI: NestJS uses app.setGlobalPrefix('api').
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_intercept_errors off; # Keep NestJS's structured JSON errors/error IDs.
        proxy_hide_header X-PQFile-Route;
        add_header X-PQFile-Route api always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        # Only Nginx-generated 502/504 errors use this handler. Nest 503 JSON
        # responses are passed through without erasing their error IDs.
        error_page 502 504 = @pqfile_api_unavailable;
    }
    location @pqfile_api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-PQFile-Route gateway-error always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"statusCode":503,"message":"Gateway khong ket noi duoc API. Kiem tra docker compose ps va logs api/gateway."}';
    }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
